<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Employee Management System</title>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- App Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <i class="fa-solid fa-users-gear"></i>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to access your organizational portal</p>
            </div>

            <!-- Session Expired Notification -->
            <div id="session-alert" style="display: none; background-color: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--warning); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.84rem; margin-bottom: 1.25rem;">
                <i class="fa-solid fa-triangle-exclamation"></i> Your previous session expired. Please sign in again.
            </div>

            <!-- Login Form -->
            <form id="form-login">
                <div class="form-group" style="margin-bottom: 1.15rem;">
                    <label for="login-email" class="form-label">Email Address <span class="required-star">*</span></label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required autocomplete="email">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="login-password" class="form-label">Password <span class="required-star">*</span></label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to EMS
                </button>
                <p>Don't have an account?</p>
                <a href="signup.html">Sign Up</a>
            </form>

            <!-- Quick Demo Accounts -->
            <div class="auth-demo-credentials">
                <div class="auth-demo-title">
                    <i class="fa-solid fa-bolt"></i> Quick Demo Accounts (One-Click Fill)
                </div>
                <p style="font-size: 0.76rem; color: var(--navy-500); margin-bottom: 0.65rem;">
                    Select an account role to test permissions (Default password: <code>Password123!</code>):
                </p>
                <div class="demo-account-pills">
                    <button type="button" class="demo-pill" onclick="fillCredentials('admin@company.com', 'Password123!')">
                        <i class="fa-solid fa-shield-halved"></i> Admin
                    </button>
                    <button type="button" class="demo-pill" onclick="fillCredentials('hr@company.com', 'Password123!')">
                        <i class="fa-solid fa-user-tie"></i> HR Manager
                    </button>
                    <button type="button" class="demo-pill" onclick="fillCredentials('employee@company.com', 'Password123!')">
                        <i class="fa-solid fa-user"></i> Employee
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user already logged in
            if (Auth.isAuthenticated()) {
                window.location.replace('dashboard.html');
                return;
            }

            // Check for ?expired=true
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('expired') === 'true') {
                const alertEl = document.getElementById('session-alert');
                if (alertEl) alertEl.style.display = 'block';
            }

            // Form Submit handler
            const form = document.getElementById('form-login');
            const submitBtn = document.getElementById('btn-login-submit');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="spinner" style="width: 18px; height: 18px; border-width: 2px;"></div> Signing in...';

                try {
                    const user = await Auth.login(email, password);
                    showToast('success', 'Authentication Successful', `Welcome back, ${user.display_name}!`);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 600);
                } catch (err) {
                    showToast('error', 'Sign In Failed', err.message || 'Invalid email or password.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to EMS';
                }
            });
        });

        function fillCredentials(email, password) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;
        }
    </script>
</body>
</html>
